name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.10
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          configurationFile: renovate-config.js
        env:
          LOG_LEVEL: info
